name: .NET Core

on: [push]

jobs:
  build:

    # Dev CI runner for push, workflow_dispatch and schedule only; every other event keeps the GitHub-hosted runner.
    runs-on: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) && '["self-hosted","linux","x64","dev-ci","repo-openmu-munique"]' || '"ubuntu-latest"') }}

    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    - name: Build with dotnet
      run: dotnet publish src/Startup/MUnique.OpenMU.Startup.csproj --configuration Release -p:ci=true
    - name: Test with dotnet
      run: dotnet test src/MUnique.OpenMU.sln --configuration Release -p:ci=true
